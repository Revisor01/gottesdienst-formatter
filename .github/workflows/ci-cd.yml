name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege — einzelne Jobs erhoehen bei Bedarf selbst.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r web/requirements.txt
          pip install -r web/requirements-dev.txt

      - name: Run tests
        run: pytest web/tests/ -v

  image:
    needs: tests
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}
      kontext: ./web
      node-version: "24"
      vorbereitung: |
        npm ci
        npm run tw:build
